<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0a2947">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>

<style>
/* Layout: sticky title bar with page tabs, then a responsive grid of chart cards; forms sit beside their charts. The sheet is the database. */
:root{
  --bg:#f5f0e6; --surface:#fbf8f1; --ink:#14201b; --ink2:#4d5750; --muted:#85867a;
  --grid:#e6dfcd; --axis:#cfc6ad; --line:rgba(30,59,47,.14); --accent-ink:#ffffff;
  --good:#1f6b2a; --bad:#c0392b;
  --ac:#0a2947; --acd:#8fb0d6; --accent:var(--ac); --wash:color-mix(in srgb,var(--accent) 10%,transparent);
  --e-share:#0a2947; --e-fund:#7f8c6a; --e-saving:#8b5e3c; --e-gold:#c8b48a; --e-cons:#1e3b2f; --e-shop:#5e7fa0; --e-other:#9a8f7a;
  --s1:var(--accent); --s2:var(--e-fund); --s3:var(--e-saving); --s4:var(--e-gold); --s5:var(--e-cons); --s6:var(--e-shop); --s7:var(--e-other); --s8:var(--bad);
  --on-mark:#ffffff;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --ink:#f3eee2; --ink2:#c9c6b6; --muted:#8e9285;
  --grid:#26322c; --axis:#3a4740; --line:rgba(245,240,230,.12); --accent:var(--acd); --accent-ink:#0e1512;
  --good:#5fbf6b; --bad:#ef7b6e;
  --e-share:#8fb0d6; --e-fund:#a3b38a; --e-saving:#d2a97e; --e-gold:#c8b48a; --e-cons:#8fbba3; --e-shop:#c9cbb4; --e-other:#9a9484; --on-mark:#0e1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --ink:#f3eee2; --ink2:#c9c6b6; --muted:#8e9285;
  --grid:#26322c; --axis:#3a4740; --line:rgba(245,240,230,.12); --accent:var(--acd); --accent-ink:#0e1512;
  --good:#5fbf6b; --bad:#ef7b6e;
  --e-share:#8fb0d6; --e-fund:#a3b38a; --e-saving:#d2a97e; --e-gold:#c8b48a; --e-cons:#8fbba3; --e-shop:#c9cbb4; --e-other:#9a9484; --on-mark:#0e1512; color-scheme:dark}
/* each page has its own accent, drawn from the two palettes (light / dark step) */
:root[data-page="dashboard"]{--ac:#0a2947;--acd:#8fb0d6}
:root[data-page="consumption"]{--ac:#8b5e3c;--acd:#d2a97e}
:root[data-page="set-50"]{--ac:#1e3b2f;--acd:#8fbba3}
:root[data-page="fund"]{--ac:#6f7d58;--acd:#a9b88f}
:root[data-page="usd"]{--ac:#4a6a8a;--acd:#9db8d3}
:root[data-page="shopping"]{--ac:#94773b;--acd:#d9c390}
:root[data-page="settings"]{--ac:#5a5f52;--acd:#d3d4c0}
*{box-sizing:border-box}
body{background:var(--bg);background:color-mix(in srgb,var(--accent) 7%,var(--bg));color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.sync{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--e-gold)} .dot.err{background:var(--bad)}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:6px 12px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav a:hover{background:var(--wash)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;letter-spacing:-.02em;margin:0;text-wrap:balance;color:var(--accent)}
h2{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
.pagehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pagehead p{margin:0;color:var(--ink2)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid.w3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:16px;min-width:0}
.card .sub{color:var(--ink2);font-size:12px;margin:2px 0 12px}
.card.span2{grid-column:1/-1}
.lbl{font-size:12px;color:var(--ink2);font-weight:500}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));min-width:0}
.tile b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.tile small{color:var(--ink2);font-size:12px}
.neg{color:var(--bad)} .pos{color:var(--good)}
.hero{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:end}
@media(min-width:760px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr)}}
.hero-n{font-size:clamp(40px,8vw,56px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--wash);border-color:var(--accent);color:var(--ink)}
/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--ink2);font-weight:500}
.fld input,.fld select{border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.fld.wide{grid-column:1/-1}
.formfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.calc{color:var(--ink2);font-size:12px}
.err{color:var(--bad);font-size:12px}
.note{border:1px solid var(--line);background:var(--wash);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:rgba(237,161,0,.12);border-color:rgba(237,161,0,.45)}
/* feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .d{color:var(--ink2);font-size:12px}
.feed .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .a{font-variant-numeric:tabular-nums;font-weight:500}
/* bars */
.hb{display:grid;grid-template-columns:minmax(96px,176px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hb-l{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{position:relative;height:16px}
.hb-b{position:absolute;top:1px;height:14px;display:block}
.hb-b.p{border-radius:0 4px 4px 0}.hb-b.n{border-radius:4px 0 0 4px}
.hb-z{position:absolute;top:0;bottom:0;width:1px;background:var(--axis)}
.hb-m{position:absolute;top:-1px;height:18px;width:2px;background:var(--ink);text-decoration:none}
.hb-v{font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.seg{display:flex;gap:2px;height:28px}
.seg i{display:flex;align-items:center;padding-left:8px;border-radius:4px;font-style:normal;font-size:12px;font-weight:600;color:var(--on-mark);overflow:hidden;white-space:nowrap;min-width:2px}
.seg i.dk{color:#0b0b0b}
/* dashboard: navy is the main colour, cream text on it */
:root[data-page="dashboard"] body{background:color-mix(in srgb,#0a2947 9%,var(--bg))}
:root[data-page="dashboard"] body::before{background:#0a2947}
:root[data-page="dashboard"] .top{background:#0a2947;border-bottom-color:#0a2947;box-shadow:none}
:root[data-page="dashboard"] .brand{color:#f3e4c9}
:root[data-page="dashboard"] .sync{color:#d3d4c0}
:root[data-page="dashboard"] .sync .btn{background:transparent;border-color:rgba(243,228,201,.35);color:#f3e4c9}
:root[data-page="dashboard"] .nav a{color:#d3d4c0}
:root[data-page="dashboard"] .nav a:hover{background:rgba(243,228,201,.12)}
:root[data-page="dashboard"] .nav a[aria-current="page"]{background:#f3e4c9;color:#0a2947}
.card.navy{background:#0a2947;border-color:#0a2947;color:#f3e4c9}
.card.navy .lbl,.card.navy .hero-n{color:#f3e4c9}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.chartbox{width:100%;min-height:120px}
svg text{font-family:var(--font)}
svg .ax{fill:var(--muted);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .zl{stroke:var(--axis);stroke-width:1}
.empty{color:var(--ink2);padding:24px 0;text-align:center}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;display:none;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:70;display:none;max-width:calc(100% - 32px)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
#modal .card{width:100%;max-width:520px;margin-top:6vh}
.state{max-width:520px;margin:12vh auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.state p{color:var(--ink2);margin:0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--grid);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.setgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand">Financial Record</div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Connecting to your sheet</span><button class="btn sm" id="refresh" type="button">Refresh</button></div>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
</div></div>
<div class="wrap"><main id="view"><div class="state"><div class="spin"></div><p>Reading your sheet</p></div></main></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<div id="modal" aria-modal="true" role="dialog"></div>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>

<script>
(function(){
'use strict';
var SID=(window.FIN_CONFIG&&window.FIN_CONFIG.sheetId)||'1dcerd9SGKXyMKqV3G_-1NLXmD0SjoKGRXMZjDmJpQ_A';
var $=function(s){return document.querySelector(s)};
var mcp=false;
var S={dash:[],cons:[],set:[],fund:[],usd:[],shop:[],loaded:false,busy:false,err:null,authError:null,syncedAt:null,range:'30',showAll:{},
  f:{set:{type:'buy',v:{},edit:null},fund:{type:'buy',v:{},edit:null},usd:{type:'deposit',v:{},edit:null},shop:{type:'expense',v:{},edit:null}},
  cf:null,formErr:{}};
var PAGES=[['dashboard','Dashboard'],['consumption','Consumption'],['set-50','SET 50'],['fund','Fund'],['usd','USD'],['shopping','Shopping'],['settings','Settings']];
var queue=[];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tc(s){return String(s==null?'':s).replace(/(^|[\s(\/-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
function p2(n){return String(n).padStart(2,'0')}
function dm(d){return p2(d.getDate())+'/'+p2(d.getMonth()+1)}
function dmy(d){return dm(d)+'/'+d.getFullYear()}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function fromIso(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function pd(s){var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s||''));return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function num(v){
  if(typeof v==='number')return v; if(v==null)return null;
  var s=String(v).trim(); if(!s||s==='-')return null;
  var neg=/^[-−(]/.test(s)||/^[฿$A-Za-z]*-/.test(s);
  var n=parseFloat(s.replace(/[^0-9.]/g,'')); if(isNaN(n))return null;
  return neg?-n:n;
}
function pct(v){var n=num(v);if(n==null)return null;return String(v).indexOf('%')>=0?n/100:n}
var nf2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
var nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
function baht(n){if(n==null||isNaN(n))return '–';return (n<0?'−':'')+'฿'+nf2.format(Math.abs(n))}
function usd(n){if(n==null||isNaN(n))return '–';return (n<0?'−':'')+'$'+nf2.format(Math.abs(n))}
function sgn(n){return (n>0?'+':'')+baht(n)}
function ax(n){var a=Math.abs(n);return (n<0?'−':'')+(a>=1e6?+(a/1e6).toFixed(1)+'M':a>=1e4?+(a/1e3).toFixed(1)+'K':nf0.format(a))}
function pc(n,d){return n==null?'–':(n*100).toFixed(d==null?1:d)+'%'}
function C(r,i){var v=r&&r[i];return v==null?'':v}
function D(c,r){return C(S.dash[r-1],c.charCodeAt(0)-65)}
function sum(a,f){return a.reduce(function(t,x){return t+(f?f(x):x)},0)}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ---------- sign-in and sheet io (Google Sheets API) ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
var CFG=window.FIN_CONFIG||{};
var CLIENT_ID=String(CFG.clientId||lsGet('fin.clientId')||'').trim();
var tok=null,tokExp=0;
function haveToken(){return !!tok&&Date.now()<tokExp-30000}
function restoreToken(){var t=lsGet('fin.tok'),e=+lsGet('fin.exp')||0;if(t&&Date.now()<e-30000){tok=t;tokExp=e}}
function redirectUri(){return location.origin+location.pathname}
function startAuth(silent){
  var pg=(location.hash||'#dashboard').slice(1).replace(/[^a-z0-9-]/gi,'')||'dashboard';
  var q={client_id:CLIENT_ID,redirect_uri:redirectUri(),response_type:'token',scope:'https://www.googleapis.com/auth/spreadsheets',include_granted_scopes:'true',state:'fin:'+pg};
  if(silent)q.prompt='none';
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+Object.keys(q).map(function(k){return k+'='+encodeURIComponent(q[k])}).join('&');
}
function parseAuthReturn(){
  var h=location.hash.slice(1);if(!h||h.indexOf('state=fin')<0)return;
  var p=new URLSearchParams(h),pg=(p.get('state')||'').replace(/^fin:/,'')||'dashboard';
  if(p.get('access_token')){
    tok=p.get('access_token');tokExp=Date.now()+(+p.get('expires_in')||3600)*1000;
    lsSet('fin.tok',tok);lsSet('fin.exp',String(tokExp));lsSet('fin.signed','1');
  } else if(p.get('error')){S.authError=p.get('error');lsSet('fin.signed','0')}
  try{history.replaceState(null,'',location.pathname+location.search+'#'+pg)}catch(e){location.hash='#'+pg}
}
function signOut(){lsDel('fin.tok');lsDel('fin.exp');lsSet('fin.signed','0');tok=null;tokExp=0;location.reload()}
function api(method,url,body){
  if(!haveToken())return Promise.reject({code:'needs_signin',message:'Your Google sign-in has expired.'});
  return fetch(url,{method:method,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401){tok=null;lsDel('fin.tok');return Promise.reject({code:'needs_signin',message:'Your Google sign-in has expired.'})}
    if(!r.ok)return r.json().catch(function(){return {}}).then(function(j){
      var m=(j.error&&j.error.message)||('Request failed ('+r.status+')');
      return Promise.reject({code:r.status===403?'forbidden':'upstream_error',message:r.status===403?'This Google account cannot edit the sheet. '+m:m})});
    return r.json();
  });
}
function rd(range){
  return api('GET','https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(range)).then(function(j){return j.values||[]});
}
function wr(range,values){
  return api('PUT','https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(range)+'?valueInputOption=USER_ENTERED',{range:range,majorDimension:'ROWS',values:values});
}
function parseCons(v){
  return v.map(function(r,i){var d=pd(C(r,0));if(!d)return null;
    return {row:i+3,date:d,key:iso(d),bf:num(C(r,1))||0,lunch:num(C(r,2))||0,dinner:num(C(r,3))||0,drink:num(C(r,4))||0,
      title:String(C(r,5)||'').trim(),price:num(C(r,6))||0,income:num(C(r,7))||0,expense:num(C(r,8)),bal:num(C(r,9)),total:num(C(r,10)),rec:C(r,8)!==''}}).filter(Boolean);
}
function parseLedger(v,kind){
  var out=[];
  v.forEach(function(r,i){
    if(kind==='shop'){ if(C(r,5)==='')return;
      out.push({row:i+2,date:pd(C(r,0)),inc:num(C(r,1))||0,incN:String(C(r,2)||''),exp:num(C(r,3))||0,expN:String(C(r,4)||''),bal:num(C(r,5))||0,tot:num(C(r,6)),opening:out.length===0});
    } else { if(C(r,7)==='')return;

}

  S.usd.forEach(function(e){if(e.a==='USD'&&e.usd!=null&&e.date){run+=e.usd;cum.push({x:e.date.getTime(),y:run,tip:dmy(e.date)+'\nHolding '+usd(run)})}});
  return head('USD','')
    +'<div class="tiles">'+tile('Dollars held',usd(held),'Including interest')+tile('Baht paid',baht(pw),'Price when bought')+tile('Average rate','฿'+nf2.format(basis||0),'Per dollar')+tile('Interest',usd(intr))+tile('Cash',baht(lastTot(S.usd)))+'</div>'
    +'<div class="grid">'+formCard('usd')+feedCard('usd')
    +card('Exchange rate paid','',mount(function(w){return lineSvg(w,220,rates,{dots:true,ref:basis?{value:basis,label:'Average ฿'+nf2.format(basis)}:null,yFmt:function(n){return nf2.format(n)},label:'Exchange rate paid'})}))
    +card('Dollars held','',mount(function(w){return lineSvg(w,220,[{points:cum}],{area:true,yFmt:function(n){return '$'+ax(n)},label:'Dollars held'})}))
    +card('Baht cash balance','',mount(function(w){return lineSvg(w,200,balLine(S.usd,'Cash'),{area:true,label:'USD cash balance'})}),'span2')
    +'</div>';
}
/* Shopping */
function pgShop(){
  var bal=lastTot(S.shop),rows=S.shop.filter(function(e){return !e.opening}),spent=sum(rows,function(e){return e.exp}),inc=sum(rows,function(e){return e.inc});
  var big=rows.reduce(function(b,e){return e.exp>(b?b.exp:0)?e:b},null);
  var items=rows.filter(function(e){return e.exp>0}).map(function(e){return {label:e.expN||'Expense',value:e.exp,text:baht(e.exp),tip:(e.expN||'Expense')+'\n'+(e.date?dmy(e.date):'')+'\n'+baht(e.exp)}}).sort(function(a,b){return b.value-a.value});
  var mi=monthCols(S.shop,function(e){return e.inc}),me=monthCols(S.shop,function(e){return e.exp});
  return head('Shopping','')
    +'<div class="tiles">'+tile('Balance',baht(bal))+tile('Spent',baht(spent))+tile('Income',baht(inc))+tile('Biggest purchase',big?baht(big.exp):'–',big?big.expN:'')+'</div>'
    +'<div class="grid">'+formCard('shop')+feedCard('shop')
    +card('Balance over time','',mount(function(w){return lineSvg(w,220,balLine(S.shop,'Balance'),{zero:true,area:true,label:'Shopping balance'})}))
    +card('Purchases','',hbars(items))
    +card('Monthly Income','',mount(function(w){return colSvg(w,200,mi,{label:'Monthly income'})}))
    +card('Monthly Expenses','',mount(function(w){return colSvg(w,200,me,{color:'var(--e-saving)',label:'Monthly expenses'})}))
    +'</div>';
}
/* Settings */
function pgSettings(){
  function nrow(id,label,val,suffix){return '<label class="fld"><span>'+esc(label)+'</span><input id="'+id+'" data-s="'+id+'" type="number" step="any" inputmode="decimal" value="'+esc(val)+'"></label>'}
  var acc='',pur='',plan='',tg='',r;
  for(r=6;r<=9;r++)acc+=nrow('acc'+r,D('B',r)+' (%)',+(pct(D('D',r))*100).toFixed(2));
  for(r=6;r<=10;r++)pur+=nrow('pur'+r,D('E',r)+' (%)',+(pct(D('F',r))*100).toFixed(2));
  for(r=28;r<=30;r++)plan+=nrow('plan'+r,D('B',r)+' (%)',+(pct(D('C',r))*100).toFixed(2));
  stocks().forEach(function(s){tg+=nrow('tgt'+s.row,s.stock+' (%)',+((s.target||0)*100).toFixed(2))});
  function grp(t,sub,body,act,extra){return '<section class="card"><h2>'+esc(tc(t))+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'<div style="height:10px"></div>')+'<div class="form">'+body+'</div><div class="formfoot"><button class="btn primary" type="button" data-act="set-save" data-g="'+act+'">Save</button><span class="calc" id="sum-'+act+'">'+(extra||'')+'</span><span class="err" id="serr-'+act+'"></span></div></section>'}
  return head('Settings','')
    +'<div class="setgrid">'
    +grp('Weekly income','',nrow('inc','Weekly income (฿)',num(D('F',2))||0),'inc')
    +grp('Physical gold','',nrow('gold','Gold total (฿)',num(D('I',6))||0),'gold')
    +grp('Account allocation','',acc,'acc','')
    +grp('Income allocation','',pur,'pur','')
    +grp('Investment plan ratio','',plan,'plan','')
    +grp('SET 50 targets','',tg+nrow('tgttot','Total target (฿)',num(D('M',13))||0),'tgt','')
    +'<section class="card"><h2>Account</h2><div style="height:10px"></div><div class="formfoot" style="margin-top:0"><button class="btn" type="button" data-act="signout">Sign out</button></div></section>'
    +'</div>';
}

/* ---------- actions ---------- */
function afterWrite(msg){return loadAll().then(function(){toast(msg)})}
function doErr(e){var m=(e&&e.message)||(e&&e.code)||'Write failed';toast('Could not save: '+m)}
function saveCons(key,vals){
  var target=S.cons.filter(function(c){return c.key===key})[0];if(!target)return Promise.reject({message:'Date is outside the sheet'});
  return freshLastCons().then(function(last){
    var start=Math.min(last+1,target.row),rows=[];
    for(var r=start;r<=target.row;r++)rows.push(r===target.row?vals:[0,0,0,0,'',0,0]);
    return wr('Consumption!C'+start+':I'+target.row,rows);
  });
}
function consVals(v){var N=function(k){return num(v[k])||0};return [N('bf'),N('lunch'),N('dinner'),N('drink'),v.title||'',N('price'),N('income')]}
function allowLines(){
  var amt=num(D('F',2))||0,L=[],map={Consumption:'cons',Share:'set',Fund:'fund',Saving:'usd',Shopping:'shop'},name={cons:'Consumption (Make)',set:'SET 50',fund:'Fund',usd:'USD',shop:'Shopping'};
  for(var r=6;r<=10;r++){var n=String(D('E',r)).trim(),p=pct(D('F',r))||0;if(map[n])L.push({tab:map[n],label:name[map[n]],amt:+(amt*p).toFixed(2)})}
  return {total:amt,lines:L};
}
function openModal(html){var m=$('#modal');m.innerHTML=html;m.style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function allowModal(){
  var a=allowLines(),k=S.cons.length?iso(new Date()):'',first=S.cons[0].key,last=S.cons[S.cons.length-1].key;if(k<first)k=first;if(k>last)k=last;
  openModal('<section class="card"><h2>Add Allowance</h2><p class="sub">Splits one amount across the tabs using your purpose split. Change any line before saving. Shopping, Fund, SET 50 and USD get a new entry dated today by the sheet. Consumption adds to the income on the date you pick.</p>'
    +'<div class="form"><label class="fld wide"><span>Total received (฿)</span><input id="al-total" type="number" step="any" inputmode="decimal" value="'+a.total+'"></label>'
    +a.lines.map(function(l){return '<label class="fld"><span>'+l.label+' (฿)</span><input id="al-'+l.tab+'" data-al="'+l.tab+'" type="number" step="any" inputmode="decimal" value="'+l.amt+'"></label>'}).join('')
    +'<label class="fld"><span>Consumption date</span><input id="al-date" type="date" min="'+first+'" max="'+last+'" value="'+k+'"></label></div>'
    +'<div class="formfoot"><button class="btn primary" type="button" data-act="allow-save">Save</button><button class="btn" type="button" data-act="modal-close">Cancel</button><span class="calc" id="al-sum"></span><span class="err" id="al-err"></span></div></section>');
  allowSum();
}
function allowSum(){var t=num($('#al-total')&&$('#al-total').value)||0,s=0;document.querySelectorAll('[data-al]').forEach(function(i){s+=num(i.value)||0});var el=$('#al-sum');if(el)el.textContent='Lines total '+baht(s)+(Math.abs(s-t)>0.005?' · '+baht(t-s)+' left to place':'')}
function goldModal(){
  openModal('<section class="card"><h2>Add gold</h2><p class="sub">Current total '+baht(num(D('I',6)))+'. Enter what you just bought, at the price you paid.</p>'
    +'<div class="form"><label class="fld"><span>Bought (฿)</span><input id="gd-amt" type="number" step="any" inputmode="decimal"></label></div>'
    +'<div class="formfoot"><button class="btn primary" type="button" data-act="gold-save">Add to gold</button><button class="btn" type="button" data-act="modal-close">Cancel</button><span class="err" id="gd-err"></span></div></section>');
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(ev.target.id==='modal'){closeModal();return}
  if(!b)return;var act=b.getAttribute('data-act'),tab=b.getAttribute('data-tab');
  if(act==='refresh'){if(!mcp)return;loadAll();return}
  if(act==='signin'){if(!CLIENT_ID){S.err={code:'setup'};render();return}startAuth(false);return}
  if(act==='signout'){signOut();return}
  if(act==='setup-open'){S.err={code:'setup'};S.loaded=false;render();return}
  if(act==='setup-save'){var cv=(document.getElementById('cid-in').value||'').trim();if(!/\.apps\.googleusercontent\.com$/.test(cv)){document.getElementById('cid-err').textContent='That does not look like a client ID. It ends with .apps.googleusercontent.com';return}
    lsSet('fin.clientId',cv);CLIENT_ID=cv;S.err={code:'needs_signin'};render();return}
  if(act==='range'){S.range=b.getAttribute('data-v');render();return}
  if(act==='showall'){S.showAll[tab]=!S.showAll[tab];render();return}
  if(act==='ftype'){S.f[tab].type=b.getAttribute('data-v');S.formErr[tab]='';drawForm(tab);return}
  if(act==='edit'){var e=S[tab].filter(function(x){return String(x.row)===b.getAttribute('data-row')})[0];if(!e)return;var m=fromEntry(tab,e);S.f[tab]={type:m.type,v:m.v,edit:{row:e.row,dateText:e.date?dmy(e.date):''}};S.formErr[tab]='';drawForm(tab);document.getElementById('form-'+tab).scrollIntoView({behavior:'smooth',block:'center'});return}
  if(act==='fcancel'){S.f[tab].edit=null;S.f[tab].v={};drawForm(tab);return}
  if(act==='fsave'){
    var F=S.f[tab],w=buildWrite(tab,F.type,F.v,F.edit?F.edit.row:0);
    if(w.err){S.formErr[tab]=w.err;document.getElementById('err-'+tab).textContent=w.err;return}
    S.formErr[tab]='';b.disabled=true;
    var go=F.edit?Promise.resolve(F.edit.row):freshNext(tab);
    go.then(function(row){var w2=buildWrite(tab,F.type,F.v,row);return wr(w2.range,w2.values)})
      .then(function(){var wasEdit=!!F.edit;S.f[tab].v={};S.f[tab].edit=null;return afterWrite(wasEdit?'Entry updated':'Entry added')}).catch(function(e){b.disabled=false;doErr(e)});
    return;
  }
  if(act==='cdate'){var d=+b.getAttribute('data-d'),k;if(d===0)k=iso(new Date());else{var x=fromIso(S.cf.key);x.setDate(x.getDate()+d);k=iso(x)}
    var first=S.cons[0].key,last=S.cons[S.cons.length-1].key;if(k<first)k=first;if(k>last)k=last;consPick(k);S.formErr.cons='';render();return}
  if(act==='cons-save'){b.disabled=true;saveCons(S.cf.key,consVals(S.cf.v)).then(function(){return afterWrite('Day saved')}).catch(function(e){b.disabled=false;doErr(e)});return}
  if(act==='allow-open'){allowModal();return}
  if(act==='gold-open'){goldModal();return}
  if(act==='modal-close'){closeModal();return}
  if(act==='gold-save'){var g=num($('#gd-amt').value);if(!(g>0)){$('#gd-err').textContent='Enter the amount you bought.';return}
    b.disabled=true;wr('Dashboard!I6',[[+((num(D('I',6))||0)+g).toFixed(2)]]).then(function(){closeModal();return afterWrite('Gold added')}).catch(function(e){b.disabled=false;doErr(e)});return}
  if(act==='allow-save'){
    var tot=num($('#al-total').value)||0,lines={},s=0;document.querySelectorAll('[data-al]').forEach(function(i){var n=num(i.value)||0;lines[i.getAttribute('data-al')]=n;s+=n});
    if(Math.abs(s-tot)>0.005){$('#al-err').textContent='The lines add up to '+baht(s)+', not '+baht(tot)+'.';return}
    var key=$('#al-date').value;if(!key){$('#al-err').textContent='Pick the Consumption date.';return}
    b.disabled=true;
    var seq=Promise.resolve(),done=[];
    ['set','fund','usd','shop'].forEach(function(t){if(!(lines[t]>0))return;
      seq=seq.then(function(){return freshNext(t)}).then(function(row){
        var type=t==='shop'?'income':t==='usd'?'deposit':'allowance',w=buildWrite(t,type,{amount:String(lines[t])},row);return wr(w.range,w.values)}).then(function(){done.push(t)})});
    if(lines.cons>0){seq=seq.then(function(){var e=S.cons.filter(function(c){return c.key===key})[0];
      var v={bf:e?e.bf:0,lunch:e?e.lunch:0,dinner:e?e.dinner:0,drink:e?e.drink:0,title:e?e.title:'',price:e?e.price:0,income:(e?e.income:0)+lines.cons};return saveCons(key,consVals(v))}).then(function(){done.push('cons')})}
    seq.then(function(){closeModal();return afterWrite('Allowance added')}).catch(function(e){b.disabled=false;$('#al-err').textContent='Saved '+(done.join(', ')||'nothing')+' before an error: '+((e&&e.message)||'write failed');loadAll()});
    return;
  }
  if(act==='set-save'){settingsSave(b.getAttribute('data-g'),b);return}
});
function settingsSave(g,b){
  var v=function(id){return num(document.getElementById(id).value)},err=document.getElementById('serr-'+g),jobs=[],r,total;
  err.textContent='';
  function chk(ids){total=0;ids.forEach(function(i){var n=v(i);if(n==null||n<0)total=NaN;else total+=n});if(isNaN(total)||Math.abs(total-100)>0.01){err.textContent='These must total 100%. Now '+(isNaN(total)?'invalid':(+total.toFixed(2))+'%')+'.';return false}return true}
  if(g==='inc'){if(!(v('inc')>=0))return;jobs=[['Dashboard!F2',[[v('inc')]]]]}
  else if(g==='gold'){if(!(v('gold')>=0))return;jobs=[['Dashboard!I6',[[v('gold')]]]]}
  else if(g==='acc'){var a=[6,7,8,9].map(function(r){return 'acc'+r});if(!chk(a))return;jobs=[['Dashboard!D6:D9',a.map(function(i){return [+(v(i)/100).toFixed(6)]})]]}
  else if(g==='pur'){var p=[6,7,8,9,10].map(function(r){return 'pur'+r});if(!chk(p))return;jobs=[['Dashboard!F6:F10',p.map(function(i){return [+(v(i)/100).toFixed(6)]})]]}
  else if(g==='plan'){var q=[28,29,30].map(function(r){return 'plan'+r});if(!chk(q))return;jobs=[['Dashboard!C28:C30',q.map(function(i){return [+(v(i)/100).toFixed(6)]})]]}
  else if(g==='tgt'){var t=stocks(),ids=t.map(function(s){return 'tgt'+s.row});if(!chk(ids))return;if(!(v('tgttot')>0)){err.textContent='Enter the total target.';return}
    jobs=[['Dashboard!M14:M'+(13+t.length),ids.map(function(i){return [+(v(i)/100).toFixed(6)]})],['Dashboard!M13',[[v('tgttot')]]]]}
  b.disabled=true;
  jobs.reduce(function(p,j){return p.then(function(){return wr(j[0],j[1])})},Promise.resolve()).then(function(){return afterWrite('Settings saved')}).catch(function(e){b.disabled=false;doErr(e)});
}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute('data-cf')){S.cf.v[t.getAttribute('data-cf')]=t.value;var N=function(k){return num(S.cf.v[k])||0},exp=N('bf')+N('lunch')+N('dinner')+N('drink')+N('price'),inc=N('income'),prev=null;
    S.cons.forEach(function(c){if(c.key<S.cf.key&&c.rec)prev=c.total});$('#cf-calc').textContent='Spent '+baht(exp)+' · Income '+baht(inc)+' · Balance after '+baht((prev||0)+inc-exp);return}
  if(t.hasAttribute&&t.hasAttribute('data-f')){var tab=t.getAttribute('data-tab'),k=t.getAttribute('data-f'),F=S.f[tab];F.v[k]=t.value;
    if(tab==='set'&&(F.type==='buy'||F.type==='sell')&&(k==='shares'||k==='price')){var u=num(F.v.shares),p=num(F.v.price);if(u>0&&p>0){var tr=trade(u,p,F.type);F.v.amount=tr.total.toFixed(2);var ai=document.getElementById('f-set-amount');if(ai)ai.value=F.v.amount}}
    var c=document.getElementById('calc-'+tab);if(c)c.textContent=calcText(tab);return}
  if(t.id==='cc-u'||t.id==='cc-p'){calcUpd();return}
  if(t.id==='al-total'||(t.hasAttribute&&t.hasAttribute('data-al')))allowSum();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute('data-cdate')){if(t.value){consPick(t.value);S.formErr.cons='';render()}return}
  if(t.hasAttribute&&t.hasAttribute('data-f')&&t.tagName==='SELECT'){S.f[t.getAttribute('data-tab')].v[t.getAttribute('data-f')]=t.value}
  if(t.hasAttribute&&t.hasAttribute('data-cf')&&t.tagName==='SELECT'){S.cf.v.title=t.value}
});
$('#refresh').addEventListener('click',function(){if(mcp)loadAll()});
function autoSync(){
  if(!mcp||S.busy||document.visibilityState!=='visible')return;
  if($('#modal').style.display==='flex')return;
  var a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  if(!haveToken()){if(lsGet('fin.signed')==='1')startAuth(true);return}
  loadAll();
}
setInterval(autoSync,60000);
document.addEventListener('visibilitychange',autoSync);

/* ---------- boot ---------- */
parseAuthReturn();
chrome();
(function(){
  if(!CLIENT_ID){S.err={code:'setup'};render();return}
  restoreToken();
  if(haveToken()){mcp=true;loadAll();return}
  if(lsGet('fin.signed')==='1'&&!S.authError){startAuth(true);return}
  S.err={code:'needs_signin'};render();
})();
})();
</script>
